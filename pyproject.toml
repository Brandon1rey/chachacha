[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mp3-shield"
version = "2.0.0"
description = "Zero-dependency polymorphic MP3 mutator for Linux: breaks crawler bot hashes, raw-stream signatures, and YARA rules with zero audio distortion."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
crypto = [
    "cryptography>=42.0.0",
]
dev = [
    "pytest>=8.0.0",
    "cryptography>=42.0.0",
]

[project.scripts]
mp3-shield = "mp3_shield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
